<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор ППУ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef2f6;
  --bg-accent: #e3ebf3;
  --surface: #ffffff;
  --ink: #152033;
  --muted: #5c6b7e;
  --line: #d5dee8;
  --line-strong: #b8c5d4;
  --accent: #0f6e8c;
  --accent-soft: #e6f3f7;
  --warn: #9a6700;
  --warn-soft: #fff6e0;
  --up: #9b2c2c;
  --down: #0f6b4c;
  --radius: 10px;
  --font: "Manrope", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  color: var(--ink);
  background:
    radial-gradient(1200px 500px at 0% -10%, #d9e8f0 0%, transparent 55%),
    radial-gradient(900px 400px at 100% 0%, #e7eef5 0%, transparent 50%),
    var(--bg);
  min-height: 100vh;
  line-height: 1.45;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.wrap { max-width: 1280px; margin: 0 auto; padding: 28px 20px 56px; }

header {
  display: flex; flex-wrap: wrap; justify-content: space-between;
  align-items: baseline; gap: 12px 24px; margin-bottom: 28px;
}
.brand { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
.brand span { color: var(--accent); }
.sub { color: var(--muted); font-size: 14px; margin-top: 4px; max-width: 40ch; }
nav { display: flex; gap: 16px; font-size: 14px; font-weight: 500; }
nav a[aria-current="page"] { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }

.modes {
  display: flex; gap: 4px; margin-bottom: 20px;
  border-bottom: 1px solid var(--line);
}
.mode {
  appearance: none; border: 0; background: transparent;
  padding: 12px 16px; font: 600 14px var(--font);
  color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.mode:hover { color: var(--ink); }
.mode.active { color: var(--ink); border-bottom-color: var(--accent); }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}
.panel h2 {
  font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 14px;
}

.vars {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px 18px;
}
.field label {
  display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;
}
.field .help { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }
.field input[type="number"], .field select {
  width: 100%; height: 40px; padding: 0 12px;
  border: 1px solid var(--line-strong); border-radius: 8px;
  background: #fbfcfd; color: var(--ink);
  font: 500 14px var(--mono);
}
.field input[type="range"] {
  width: 100%; accent-color: var(--accent); margin-top: 8px;
}
.field .row { display: grid; grid-template-columns: 1fr 88px; gap: 8px; align-items: center; }
.field .value {
  font-family: var(--mono); font-size: 13px; color: var(--accent); font-weight: 500;
}

.formula {
  margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line);
  font-size: 13px; color: var(--muted);
}
.formula code {
  font-family: var(--mono); font-size: 12px; color: var(--ink);
  background: var(--accent-soft); padding: 2px 6px; border-radius: 4px;
}

.actions {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px;
}
button.btn, .btn {
  height: 38px; padding: 0 14px; border-radius: 8px;
  border: 1px solid var(--line-strong); background: var(--surface);
  color: var(--ink); font: 600 13px var(--font); cursor: pointer;
}
button.btn:hover { border-color: var(--accent); color: var(--accent); }
button.btn.primary {
  background: var(--accent); color: #fff; border-color: var(--accent);
}
button.btn.primary:hover { filter: brightness(1.05); color: #fff; }

.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px; margin-bottom: 16px;
}
@media (max-width: 700px) { .summary { grid-template-columns: 1fr; } }
.stat {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 16px 18px;
}
.stat .l { font-size: 12px; color: var(--muted); font-weight: 600; }
.stat .v { font-size: 24px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.stat .d { font-size: 13px; margin-top: 4px; font-weight: 600; }
.d.up { color: var(--up); }
.d.down { color: var(--down); }
.d.same { color: var(--muted); }

.toolbar {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  margin-bottom: 10px;
}
.toolbar input[type="search"], .toolbar select {
  height: 38px; padding: 0 12px; border: 1px solid var(--line-strong);
  border-radius: 8px; background: var(--surface); font: 500 14px var(--font);
  color: var(--ink);
}
.toolbar input[type="search"] { flex: 1; min-width: 200px; }
.meta { font-size: 13px; color: var(--muted); margin-left: auto; }

.table-wrap {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); overflow: auto; max-height: 60vh;
}
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 960px; }
th {
  position: sticky; top: 0; background: #f5f8fb; z-index: 1;
  text-align: left; font-size: 11px; font-weight: 700;
  letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted);
  padding: 12px 10px; border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
td {
  padding: 8px 10px; border-bottom: 1px solid #eef2f6;
  white-space: nowrap; vertical-align: middle;
}
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 12px; }
tr:hover td { background: #f8fafc; }
tr.changed td { background: var(--warn-soft); }
input.cell {
  width: 86px; height: 32px; padding: 0 8px; text-align: right;
  border: 1px solid transparent; border-radius: 6px;
  background: transparent; color: var(--accent);
  font: 500 12px var(--mono);
}
input.cell:hover { border-color: var(--line); background: #fff; }
input.cell:focus { outline: none; border-color: var(--accent); background: #fff; }
input.cell.dirty { color: var(--warn); border-color: #e5c76b; background: #fff; }
.out { font-weight: 600; }
.out.changed { color: var(--warn); }

.note {
  margin-top: 14px; font-size: 13px; color: var(--muted);
  max-width: 80ch;
}
.shell-only.hidden, .steel-only.hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">Калькулятор <span>ППУ</span></div>
      <p class="sub">Пересчёт прайса: меняете переменные — сразу видите новую цену.</p>
    </div>
    <nav>
      <a href="index.html">Дашборд</a>
      <a href="calculator.html" aria-current="page">Калькулятор</a>
      <a href="9999.html">Исходный прайс</a>
    </nav>
  </header>

  <div class="modes" role="tablist">
    <button class="mode active" data-mode="pe">ПЭ-оболочка</button>
    <button class="mode" data-mode="oz">ОЦ-оболочка</button>
    <button class="mode" data-mode="steel">Сталь</button>
  </div>

  <section class="panel">
    <h2>Переменные</h2>
    <div class="vars">
      <div class="field shell-only">
        <label>Ставка ППУ, ₽/кг <span class="value" id="lbl_ppu">350</span>
          <span class="help">Стоимость изоляции = масса × ставка</span>
        </label>
        <div class="row">
          <input type="range" id="ppu_rate" min="100" max="800" step="1" value="350">
          <input type="number" id="ppu_rate_n" value="350" min="1">
        </div>
      </div>

      <div class="field">
        <label>Цена стали <span class="value" id="lbl_steel">100%</span>
          <span class="help">Множитель к цене трубы за тонну</span>
        </label>
        <div class="row">
          <input type="range" id="steel_mult" min="50" max="200" step="1" value="100">
          <input type="number" id="steel_mult_n" value="100" min="1">
        </div>
      </div>

      <div class="field shell-only">
        <label>Оболочка <span class="value" id="lbl_shell">100%</span>
          <span class="help">Множитель к стоимости оболочки</span>
        </label>
        <div class="row">
          <input type="range" id="shell_mult" min="50" max="200" step="1" value="100">
          <input type="number" id="shell_mult_n" value="100" min="1">
        </div>
      </div>

      <div class="field shell-only">
        <label>Центрирующие <span class="value" id="lbl_cent">100%</span>
          <span class="help">Множитель к цене центрирующих</span>
        </label>
        <div class="row">
          <input type="range" id="cent_mult" min="0" max="200" step="1" value="100">
          <input type="number" id="cent_mult_n" value="100" min="0">
        </div>
      </div>

      <div class="field shell-only">
        <label>Сигнальный провод
          <span class="help">Как считать провод по всем строкам</span>
        </label>
        <div class="row">
          <select id="wire_mode">
            <option value="base">Как в прайсе</option>
            <option value="fixed">Одна цена для всех</option>
            <option value="mult">Множитель к прайсу</option>
          </select>
          <input type="number" id="wire_val" value="75">
        </div>
      </div>

      <div class="field shell-only">
        <label>Маржа
          <span class="help">Надбавка к затратам</span>
        </label>
        <div class="row">
          <select id="margin_mode">
            <option value="base">Фикс. из прайса</option>
            <option value="pct">Процент от затрат</option>
            <option value="mult">Множитель к фикс.</option>
          </select>
          <input type="number" id="margin_val" value="100" step="0.1">
        </div>
      </div>

      <div class="field steel-only hidden">
        <label>Сварка и БШ <span class="value" id="lbl_svc">100%</span>
          <span class="help">Множитель к услугам</span>
        </label>
        <div class="row">
          <input type="range" id="svc_mult" min="0" max="200" step="1" value="100">
          <input type="number" id="svc_mult_n" value="100" min="0">
        </div>
      </div>
    </div>

    <div class="formula" id="formula"></div>

    <div class="actions">
      <button class="btn" id="btnReset" type="button">Сбросить переменные</button>
      <button class="btn" id="btnResetRows" type="button">Сбросить строки</button>
      <button class="btn primary" id="btnExport" type="button">Скачать CSV</button>
    </div>
  </section>

  <div class="summary" id="summary"></div>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Найти диаметр…">
    <select id="sortBy">
      <option value="name">По диаметру</option>
      <option value="price_desc">По цене ↓</option>
      <option value="delta_desc">По изменению ↓</option>
    </select>
    <span class="meta" id="meta">без изменений</span>
  </div>

  <div class="table-wrap">
    <table id="grid">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>

  <p class="note">
    Жёлтая подсветка — строка отличается от исходного прайса.
    В голубых полях можно править переменные вручную; итоги пересчитаются сразу.
  </p>
</div>

  if (g.wire_mode === 'fixed') return Number(g.wire_val) || 0;
  if (g.wire_mode === 'mult') return round2((row.wire || 0) * (Number(g.wire_val) || 0) / 100);
  return row.wire || 0;
}

function marginAddOf(row, cost) {
  const g = state.globals;
  if (g.margin_mode === 'pct') return round2(cost * (Number(g.margin_val) || 0) / 100);
  if (g.margin_mode === 'mult') return round2((row.margin_add || 0) * (Number(g.margin_val) || 0) / 100);
  return row.margin_add || 0;
}

function computeShell(row, mode) {
  const g = state.globals;
  const ov = state.overrides[mode][row.n] || {};
  const ton = round2((ov.ton != null ? ov.ton : row.ton) * g.steel_mult / 100);
  const w = ov.w != null ? ov.w : row.w;
  const ppu_m = ov.ppu_m != null ? ov.ppu_m : row.ppu_m;
  const ppu_rate = ov.ppu_rate != null ? ov.ppu_rate : g.ppu_rate;
  const centers = round2((ov.centers != null ? ov.centers : row.centers) * g.cent_mult / 100);
  const shell = round2((ov.shell != null ? ov.shell : row.shell) * g.shell_mult / 100);
  const wire = ov.wire != null ? ov.wire : wireOf(row);
  const steel = round2(w * ton / 1000);
  const ppu = round2(ppu_m * ppu_rate);
  const cost = round2(steel + ppu + centers + shell + wire);
  const mAdd = ov.margin_add != null ? ov.margin_add : marginAddOf(row, cost);
  const withMargin = round2(cost + mAdd);
  const weldAdd = ov.weld_add != null ? ov.weld_add : row.weld_add;
  const bshAdd = ov.bsh_add != null ? ov.bsh_add : row.bsh_add;
  const weld = weldAdd == null ? null : round2(withMargin + weldAdd);
  const bsh = bshAdd == null ? null : round2(withMargin + bshAdd);
  const baseSteel = round2(row.w * row.ton / 1000);
  const basePpu = round2(row.ppu_m * 350);
  const baseCost = round2(baseSteel + basePpu + row.centers + row.shell + row.wire);
  const baseMargin = round2(baseCost + row.margin_add);
  return {
    n: row.n, w, ton, ppu_m, ppu_rate, centers, shell, wire,
    steel, ppu, cost, margin_add: mAdd, withMargin, weld, bsh,
    baseMargin, delta: round2(withMargin - baseMargin),
    dirty: Object.keys(ov).length > 0
  };
}

function computeSteel(row) {
  const g = state.globals;
  const ov = state.overrides.steel[row.n] || {};
  const ton = round2((ov.ton != null ? ov.ton : row.ton) * g.steel_mult / 100);
  const weld = (row.weld == null && ov.weld == null) ? null
    : round2((ov.weld != null ? ov.weld : row.weld) * g.svc_mult / 100);
  const bsh = (row.bsh == null && ov.bsh == null) ? null
    : round2((ov.bsh != null ? ov.bsh : row.bsh) * g.svc_mult / 100);
  return {
    n: row.n, ton, weld, bsh, baseTon: row.ton,
    delta: round2(ton - row.ton), dirty: Object.keys(ov).length > 0
  };
}

function rowsComputed() {
  return state.mode === 'steel'
    ? RAW.steel.map(computeSteel)
    : RAW[state.mode].map(r => computeShell(r, state.mode));
}

function filteredRows() {
  let rows = rowsComputed();
  const q = state.search.trim().toLowerCase();
  if (q) rows = rows.filter(r => r.n.toLowerCase().includes(q));
  if (state.mode === 'steel') {
    if (state.sortBy === 'price_desc') rows.sort((a, b) => b.ton - a.ton);
    else if (state.sortBy === 'delta_desc') rows.sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));
    else rows.sort((a, b) => a.n.localeCompare(b.n, 'ru', { numeric: true }));
  } else {
    if (state.sortBy === 'price_desc') rows.sort((a, b) => b.withMargin - a.withMargin);
    else if (state.sortBy === 'delta_desc') rows.sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));
    else rows.sort((a, b) => a.n.localeCompare(b.n, 'ru', { numeric: true }));
  }
  return rows;
}

function setOverride(mode, name, key, value) {
  if (!state.overrides[mode][name]) state.overrides[mode][name] = {};
  if (value === '' || value == null) {
    delete state.overrides[mode][name][key];
    if (!Object.keys(state.overrides[mode][name]).length) delete state.overrides[mode][name];
  } else {
    state.overrides[mode][name][key] = Number(value);
  }
}

function cellInput(mode, name, key, current, base) {
  const ov = state.overrides[mode][name] || {};
  const dirty = ov[key] != null;
  const val = dirty ? ov[key] : current;
  return `<input class="cell${dirty ? ' dirty' : ''}" data-name="${name}" data-key="${key}" value="${val}" title="Исходно: ${base}">`;
}

function syncModeUI() {
  const shell = state.mode !== 'steel';
  document.querySelectorAll('.shell-only').forEach(el => el.classList.toggle('hidden', !shell));
  document.querySelectorAll('.steel-only').forEach(el => el.classList.toggle('hidden', shell));
  document.querySelectorAll('.mode').forEach(b => b.classList.toggle('active', b.dataset.mode === state.mode));
  $('formula').innerHTML = shell
    ? `Как считается цена: <code>сталь</code> = вес × цена_т / 1000 · <code>ППУ</code> = масса × ставка · <code>затраты</code> = сталь + ППУ + центры + оболочка + провод · <code>итог</code> = затраты + маржа`
    : `Как считается: <code>цена за тонну</code> = база × множитель стали · <code>сварка / БШ</code> = база × множитель услуг`;
}

function updateLabels() {
  const g = state.globals;
  $('lbl_ppu').textContent = g.ppu_rate;
  $('lbl_steel').textContent = g.steel_mult + '%';
  $('lbl_shell').textContent = g.shell_mult + '%';
  $('lbl_cent').textContent = g.cent_mult + '%';
  $('lbl_svc').textContent = g.svc_mult + '%';
}

function globalsChanged() {
  const g = state.globals;
  return !(g.ppu_rate === 350 && g.steel_mult === 100 && g.shell_mult === 100 &&
    g.cent_mult === 100 && g.wire_mode === 'base' && g.margin_mode === 'base' &&
    g.margin_val === 100 && g.svc_mult === 100);
}

function renderSummary(rows) {
  const el = $('summary');
  if (state.mode === 'steel') {
    const avg = rows.reduce((a, r) => a + r.ton, 0) / (rows.length || 1);
    const base = rows.reduce((a, r) => a + r.baseTon, 0) / (rows.length || 1);
    const d = avg - base;
    el.innerHTML = `
      <div class="stat"><div class="l">Позиций</div><div class="v">${rows.length}</div></div>
      <div class="stat"><div class="l">Средняя цена, ₽/т</div><div class="v">${fmt(avg)}</div>
        <div class="d ${d > 0 ? 'up' : d < 0 ? 'down' : 'same'}">${d > 0 ? '+' : ''}${fmt(d)} к исходному</div></div>
      <div class="stat"><div class="l">Диапазон</div><div class="v">${fmt(Math.min(...rows.map(r => r.ton)))} – ${fmt(Math.max(...rows.map(r => r.ton)))}</div></div>`;
    return;
  }
  const prices = rows.map(r => r.withMargin);
  const avg = prices.reduce((a, b) => a + b, 0) / (prices.length || 1);
  const baseAvg = rows.reduce((a, r) => a + r.baseMargin, 0) / (rows.length || 1);
  const d = avg - baseAvg;
  el.innerHTML = `
    <div class="stat"><div class="l">Позиций</div><div class="v">${rows.length}</div></div>
    <div class="stat"><div class="l">Средняя цена, ₽/п.м.</div><div class="v">${fmt(avg)}</div>
      <div class="d ${d > 0 ? 'up' : d < 0 ? 'down' : 'same'}">${d > 0 ? '+' : ''}${fmt(d)} к исходному</div></div>
    <div class="stat"><div class="l">Мин / макс</div><div class="v" style="font-size:20px">${fmt(Math.min(...prices))} / ${fmt(Math.max(...prices))}</div></div>`;
}

function renderTable(rows) {
  const thead = document.querySelector('#grid thead');
  const tbody = document.querySelector('#grid tbody');
  const mode = state.mode;

  if (mode === 'steel') {
    thead.innerHTML = `<tr>
      <th>Диаметр</th>
      <th class="num">Цена/т</th>
      <th class="num">Итог</th>
      <th class="num">Изменение</th>
      <th class="num">Сварка</th>
      <th class="num">Итог сварки</th>
      <th class="num">БШ</th>
      <th class="num">Итог БШ</th>
    </tr>`;
    tbody.innerHTML = rows.map(r => {
      const base = RAW.steel.find(x => x.n === r.n);
      return `<tr class="${r.dirty || Math.abs(r.delta) > 0.01 ? 'changed' : ''}">
        <td>${r.n}</td>
        <td class="num">${cellInput('steel', r.n, 'ton', base.ton, base.ton)}</td>
        <td class="num out ${Math.abs(r.delta) > 0.01 ? 'changed' : ''}">${fmt(r.ton)}</td>
        <td class="num ${r.delta > 0 ? 'd up' : r.delta < 0 ? 'd down' : ''}">${r.delta > 0 ? '+' : ''}${fmt(r.delta)}</td>
        <td class="num">${base.weld == null ? '—' : cellInput('steel', r.n, 'weld', base.weld, base.weld)}</td>
        <td class="num">${fmt(r.weld)}</td>
        <td class="num">${base.bsh == null ? '—' : cellInput('steel', r.n, 'bsh', base.bsh, base.bsh)}</td>
        <td class="num">${fmt(r.bsh)}</td>
      </tr>`;
    }).join('');
  } else {
    thead.innerHTML = `<tr>
      <th>Труба</th>
      <th class="num">Вес</th>
      <th class="num">Цена/т</th>
      <th class="num">ППУ, кг</th>
      <th class="num">Ставка</th>
      <th class="num">Оболочка</th>
      <th class="num">Провод</th>
      <th class="num">Затраты</th>
      <th class="num">Маржа</th>
      <th class="num">Итог</th>
      <th class="num">Изменение</th>
    </tr>`;
    tbody.innerHTML = rows.map(r => {
      const base = RAW[mode].find(x => x.n === r.n);
      return `<tr class="${r.dirty || Math.abs(r.delta) > 0.01 ? 'changed' : ''}">
        <td>${r.n}</td>
        <td class="num">${cellInput(mode, r.n, 'w', base.w, base.w)}</td>
        <td class="num">${cellInput(mode, r.n, 'ton', base.ton, base.ton)}</td>
        <td class="num">${cellInput(mode, r.n, 'ppu_m', base.ppu_m, base.ppu_m)}</td>
        <td class="num">${cellInput(mode, r.n, 'ppu_rate', state.globals.ppu_rate, 350)}</td>
        <td class="num">${cellInput(mode, r.n, 'shell', base.shell, base.shell)}</td>
        <td class="num">${cellInput(mode, r.n, 'wire', base.wire, base.wire)}</td>
        <td class="num out">${fmt(r.cost)}</td>
        <td class="num">${cellInput(mode, r.n, 'margin_add', base.margin_add, base.margin_add)}</td>
        <td class="num out ${Math.abs(r.delta) > 0.01 ? 'changed' : ''}">${fmt(r.withMargin)}</td>
        <td class="num ${r.delta > 0 ? 'd up' : r.delta < 0 ? 'd down' : ''}">${r.delta > 0 ? '+' : ''}${fmt(r.delta)}</td>
      </tr>`;
    }).join('');
  }

  tbody.querySelectorAll('input.cell').forEach(inp => {
    inp.addEventListener('change', () => {
      setOverride(mode, inp.dataset.name, inp.dataset.key, inp.value);
      render();
    });
  });

  const rowCount = Object.keys(state.overrides[mode]).length;
  const parts = [];
  if (globalsChanged()) parts.push('глобальные переменные');
  if (rowCount) parts.push(rowCount + ' строк');
  $('meta').textContent = parts.length ? 'изменено: ' + parts.join(', ') : 'без изменений';
}

function render() {
  syncModeUI();
  updateLabels();
  const rows = filteredRows();
  renderSummary(rows);
  renderTable(rows);
}

function bindDual(rangeId, numId, apply) {
  const r = $(rangeId), n = $(numId);
  const sync = from => { const v = Number(from.value); r.value = v; n.value = v; apply(v); render(); };
  r.addEventListener('input', () => sync(r));
  n.addEventListener('input', () => sync(n));
}

function readGlobals() {
  const g = state.globals;
  g.ppu_rate = Number($('ppu_rate').value);
  g.steel_mult = Number($('steel_mult').value);
  g.shell_mult = Number($('shell_mult').value);
  g.cent_mult = Number($('cent_mult').value);
  g.svc_mult = Number($('svc_mult').value);
  g.wire_mode = $('wire_mode').value;
  g.wire_val = Number($('wire_val').value);
  g.margin_mode = $('margin_mode').value;
  g.margin_val = Number($('margin_val').value);
}

function resetGlobals() {
  state.globals = {
    ppu_rate: 350, steel_mult: 100, shell_mult: 100, cent_mult: 100,
    wire_mode: 'base', wire_val: 75, margin_mode: 'base', margin_val: 100, svc_mult: 100
  };
  $('ppu_rate').value = $('ppu_rate_n').value = 350;
  $('steel_mult').value = $('steel_mult_n').value = 100;
  $('shell_mult').value = $('shell_mult_n').value = 100;
  $('cent_mult').value = $('cent_mult_n').value = 100;
  $('svc_mult').value = $('svc_mult_n').value = 100;
  $('wire_mode').value = 'base';
  $('wire_val').value = 75;
  $('margin_mode').value = 'base';
  $('margin_val').value = 100;
}

function exportCSV() {
  const rows = filteredRows();
  let csv;
  if (state.mode === 'steel') {
    csv = 'Диаметр;Цена_т;Сварка;БШ;Изменение\n' + rows.map(r =>
      [r.n, r.ton, r.weld ?? '', r.bsh ?? '', r.delta].join(';')).join('\n');
  } else {
    csv = 'Труба;Вес;Цена_т;ППУ_кг;Ставка;Оболочка;Провод;Затраты;Маржа;Итог;Изменение\n' +
      rows.map(r => [r.n, r.w, r.ton, r.ppu_m, r.ppu_rate, r.shell, r.wire, r.cost, r.margin_add, r.withMargin, r.delta].join(';')).join('\n');
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `calc_${state.mode}.csv`;
  a.click();
}

function init() {
  bindDual('ppu_rate', 'ppu_rate_n', v => { state.globals.ppu_rate = v; });
  bindDual('steel_mult', 'steel_mult_n', v => { state.globals.steel_mult = v; });
  bindDual('shell_mult', 'shell_mult_n', v => { state.globals.shell_mult = v; });
  bindDual('cent_mult', 'cent_mult_n', v => { state.globals.cent_mult = v; });
  bindDual('svc_mult', 'svc_mult_n', v => { state.globals.svc_mult = v; });
  ['wire_mode', 'wire_val', 'margin_mode', 'margin_val'].forEach(id => {
    $(id).addEventListener('input', () => { readGlobals(); render(); });
    $(id).addEventListener('change', () => { readGlobals(); render(); });
  });
  document.querySelectorAll('.mode').forEach(b => {
    b.addEventListener('click', () => { state.mode = b.dataset.mode; render(); });
  });
  $('search').addEventListener('input', e => { state.search = e.target.value; render(); });
  $('sortBy').addEventListener('change', e => { state.sortBy = e.target.value; render(); });
  $('btnReset').addEventListener('click', () => { resetGlobals(); render(); });
  $('btnResetRows').addEventListener('click', () => { state.overrides = { pe: {}, oz: {}, steel: {} }; render(); });
  $('btnExport').addEventListener('click', exportCSV);
  render();
}
init();
</script>
</body>
</html>
